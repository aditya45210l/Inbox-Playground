    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive concept: watch a WhatsApp, iMessage or SMS lead flow into a CRM inbox, trigger a workflow and get an AI reply, live." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Inbox Playground</title>
    <script>
      // apply the saved or system theme before first paint (no flash)
      try {
        var t = localStorage.getItem('cp-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {
        if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
